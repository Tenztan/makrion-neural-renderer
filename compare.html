<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Makrion: network vs Cycles</title>
<style>
  :root { --ink: #05090c; --ice: #dfe6e6; --dim: #8795a0; --gold: #d9a84a; --line: rgba(223, 230, 230, .18); }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--ink); color: var(--ice); font: 400 12px/1.5 ui-monospace, Menlo, Consolas, monospace; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 12px 16px; }
  header b { font-weight: 400; margin-right: auto; letter-spacing: .06em; text-transform: uppercase; }
  button { appearance: none; background: none; color: var(--ice); border: 1px solid var(--line); padding: 8px 11px; font: inherit; cursor: pointer; border-radius: 2px; }
  button[aria-pressed="true"] { background: var(--ice); color: var(--ink); }
  button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  #view { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 0 16px; }
  .panel { position: relative; aspect-ratio: 16 / 10; overflow: hidden; background: radial-gradient(70% 80% at 50% 38%, #142a35 0%, #0a161d 52%, var(--ink) 100%); }
  .panel canvas, .panel img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; transform-origin: 50% 10%; transition: transform .35s; }
  .face .panel canvas, .face .panel img { transform: scale(2.9); }
  .label { position: absolute; left: 10px; top: 8px; z-index: 3; letter-spacing: .06em; text-transform: uppercase; text-shadow: 0 1px 6px #000; }
  .label i { font-style: normal; color: var(--gold); }
  /* wipe: the two panels stack, Cycles on top, clipped from the left to the line */
  #view.wipe { grid-template-columns: 1fr; max-width: min(100%, 150vh); margin: 0 auto; }
  #view.wipe .panel { grid-area: 1 / 1; touch-action: none; cursor: ew-resize; }
  #view.wipe #pB { background: none; clip-path: inset(0 0 0 var(--cut, 50%)); }
  #view.wipe #pB .label { left: auto; right: 10px; }
  #line { display: none; position: absolute; top: 0; bottom: 0; left: var(--cut, 50%); width: 1px; background: var(--gold); z-index: 4; pointer-events: none; }
  #view.wipe #line { display: block; }
  #wrap { position: relative; display: contents; }
  @media (max-aspect-ratio: 1/1) { #view { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <b>Makrion · never-seen poses</b>
  <span id="pose"></span>
  <button id="prev" aria-label="Previous pose">Prev</button>
  <button id="next" aria-label="Next pose">Next</button>
  <button id="wipe" aria-pressed="false">Wipe</button>
  <button id="face" aria-pressed="false">Face</button>
</header>
<section id="view">
  <div class="panel" id="pA"><div class="label">Live network <i id="ms"></i></div><canvas id="gpu" width="1280" height="800"></canvas></div>
  <div class="panel" id="pB"><div class="label">Cycles <i id="cy"></i></div><img id="ref" alt="Cycles render of the same pose"></div>
  <div id="line"></div>
</section>
<script type="module">
import { GBuffer, loadAsset } from './src/gbuffer.js';
import { loadNetwork } from './src/nn.js';
import { Display } from './src/display.js';
const $ = (s) => document.querySelector(s);
const list = await (await fetch('./assets/compare/index.json')).json();
const adapter = await navigator.gpu.requestAdapter({ powerPreference: 'high-performance' });
const device = await adapter.requestDevice({ requiredLimits: { maxStorageBufferBindingSize: adapter.limits.maxStorageBufferBindingSize, maxBufferSize: adapter.limits.maxBufferSize } });
device.addEventListener('uncapturederror', (e) => console.error(e.error.message));
const canvas = $('#gpu'), ctx = canvas.getContext('webgpu'), format = navigator.gpu.getPreferredCanvasFormat();
ctx.configure({ device, format, alphaMode: 'premultiplied' });
const gb = new GBuffer(device, await loadAsset(device, './assets/'));
gb.resize(1280, 800);
const net = await loadNetwork(device, './assets/');
await net.build(1280, 800, gb);
const disp = new Display(device, ctx, format, gb, net);
disp.bind();
let i = 0;
async function draw() {
  const f = list.frames[i];
  $('#ref').src = `./assets/compare/${f.file}`;
  $('#pose').textContent = `${i + 1} / ${list.frames.length}`;
  $('#cy').textContent = `about ${list.cyclesSeconds} s a frame`;
  // several frames, so the label shows a settled time rather than one cold frame
  const times = [];
  for (let n = 0; n < 7; n++) {
    gb.prev = null; disp.frame = 0;
    const enc = device.createCommandEncoder();
    gb.encode(enc, f.pose);
    net.encode(enc);
    disp.encode(enc, { x: 0, y: 0, w: 1280, h: 800 }, 1280, 800, 1, 1);
    const t0 = performance.now();
    device.queue.submit([enc.finish()]);
    await device.queue.onSubmittedWorkDone();
    times.push(performance.now() - t0);
  }
  times.sort((x, y) => x - y);
  $('#ms').textContent = `${times[1].toFixed(0)} ms`;
}
$('#prev').onclick = () => { i = (i + list.frames.length - 1) % list.frames.length; draw(); };
$('#next').onclick = () => { i = (i + 1) % list.frames.length; draw(); };
const toggle = (btn, fn) => { btn.onclick = () => { const on = btn.getAttribute('aria-pressed') !== 'true'; btn.setAttribute('aria-pressed', on); fn(on); }; };
toggle($('#wipe'), (on) => $('#view').classList.toggle('wipe', on));
toggle($('#face'), (on) => $('#view').classList.toggle('face', on));
const v = $('#view');
const drag = (e) => { const r = $('#pA').getBoundingClientRect(); v.style.setProperty('--cut', `${Math.min(100, Math.max(0, (e.clientX - r.left) / r.width * 100))}%`); };
v.addEventListener('pointerdown', (e) => { if (!v.classList.contains('wipe')) return; v.setPointerCapture(e.pointerId); drag(e); v.onpointermove = drag; });
v.addEventListener('pointerup', () => { v.onpointermove = null; });
addEventListener('keydown', (e) => { if (e.key === 'ArrowRight') $('#next').click(); if (e.key === 'ArrowLeft') $('#prev').click(); });
await draw();
window.__compareReady = true;
</script>
</body>
</html>
